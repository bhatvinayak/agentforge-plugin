<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" fill="none">
  <!-- Subtle Glow -->
  <defs>
    <linearGradient id="gradBrand" x1="20" y1="20" x2="236" y2="236" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Hexagon Outer Boundary (Margin included: radius ~95) -->
  <rect x="24" y="24" width="208" height="208" rx="48" fill="#090d16" stroke="url(#gradBrand)" stroke-width="4" filter="url(#glow)"/>

  <!-- Network Circuit Lines -->
  <path d="M 64 80 L 128 56 L 192 80" stroke="#06b6d4" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 4" opacity="0.6"/>
  <path d="M 64 176 L 128 200 L 192 176" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 4" opacity="0.6"/>
  <path d="M 64 80 L 64 176" stroke="#3b82f6" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 4" opacity="0.6"/>
  <path d="M 192 80 L 192 176" stroke="#06b6d4" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 4" opacity="0.6"/>

  <!-- Network Nodes -->
  <circle cx="64" cy="80" r="7" fill="#10b981"/>
  <circle cx="192" cy="80" r="7" fill="#06b6d4"/>
  <circle cx="128" cy="56" r="7" fill="#3b82f6"/>
  <circle cx="64" cy="176" r="7" fill="#3b82f6"/>
  <circle cx="192" cy="176" r="7" fill="#10b981"/>
  <circle cx="128" cy="200" r="7" fill="#06b6d4"/>

  <!-- Center Energy Core: Lightning Bolt -->
  <path d="M 136 78 L 96 138 L 124 138 L 118 178 L 160 118 L 132 118 Z" fill="url(#gradBrand)" filter="url(#glow)"/>
</svg>
